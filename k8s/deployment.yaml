apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-practice
  labels:
    app: devops-practice

spec:
  replicas: 2

  selector:
    matchLabels:
      app: devops-practice

  template:
    metadata:
      labels:
        app: devops-practice

    spec:
      containers:
      - name: devops-practice

        image: venkagre1/devops-practice:v1

        imagePullPolicy: Always

        ports:
        - containerPort: 8080
